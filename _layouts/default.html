<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--vio:#7C3AED;--viod:#5B21B6;--vioc:#f3eefe;--tinta:#2b2540;--gris:#6b6880;--bor:#e3dcf5;}
*{box-sizing:border-box;}
body{margin:0;background:#f5f3fa;color:var(--tinta);
     font-family:Raleway,-apple-system,"Segoe UI",Helvetica,sans-serif;line-height:1.65;}
a{color:var(--viod);text-decoration:none;} a:hover{text-decoration:underline;}
.cab{background:linear-gradient(120deg,#5B21B6,#7C3AED 60%,#a855f7);color:#fff;padding:46px 22px 38px;text-align:center;}
.cab h1{margin:0 0 6px;font-size:2rem;font-weight:700;letter-spacing:-.01em;}
.cab p{margin:0;opacity:.9;font-size:1rem;}
.hoja{max-width:820px;margin:-18px auto 40px;background:#fff;border:1px solid var(--bor);
      border-radius:14px;padding:34px 38px 40px;box-shadow:0 4px 20px rgba(91,33,182,.09);}
@media(max-width:640px){.hoja{margin:-10px 10px 26px;padding:22px 18px 28px;border-radius:10px;}.cab{padding:34px 16px 30px;}.cab h1{font-size:1.5rem;}}
.hoja h1{font-size:1.6rem;margin:0 0 4px;color:var(--viod);}
.hoja h2{font-size:1.25rem;margin:34px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--vioc);color:var(--viod);}
.hoja h2:first-child{margin-top:0;}
.hoja h3{font-size:1.05rem;margin:30px 0 0;padding:0 0 0 14px;border-left:5px solid var(--vio);color:var(--tinta);}
.hoja h3 + ul{list-style:none;margin:10px 0 4px;padding:14px 20px;background:#faf8ff;
              border:1px solid var(--bor);border-left:5px solid var(--vio);border-radius:0 10px 10px 0;}
.hoja h3 + ul li{margin:5px 0;}
.hoja h3 + ul li strong{color:var(--viod);}
.hoja hr{border:0;height:1px;background:var(--vioc);margin:30px 0;}
.hoja table{border-collapse:collapse;margin:14px 0;width:100%;font-size:.94rem;}
.hoja th,.hoja td{border:1px solid var(--bor);padding:7px 12px;text-align:left;}
.hoja th{background:var(--vioc);color:var(--viod);}
.hoja img{max-width:100%;border:1px solid var(--bor);border-radius:10px;display:block;margin:14px 0;}
.hoja code{background:var(--vioc);color:var(--viod);padding:2px 7px;border-radius:5px;
           font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;}
.hoja pre{background:#241d3d;color:#ece7fb;padding:15px 18px;border-radius:10px;overflow-x:auto;}
.hoja pre code{background:none;color:inherit;padding:0;}
.hoja blockquote{border-left:4px solid var(--bor);color:var(--gris);margin:14px 0;padding:2px 0 2px 16px;}
.av{border-left:4px solid;padding:10px 16px;margin:14px 0;border-radius:0 8px 8px 0;background:#fff;}
.av .av-l{font-weight:700;font-size:.86rem;margin-bottom:2px;}
.av.n{border-color:#0969da;background:#f2f7fd;} .av.n .av-l{color:#0969da;}
.av.t{border-color:#1a7f37;background:#f2faf4;} .av.t .av-l{color:#1a7f37;}
.av.w{border-color:#9a6700;background:#fdf9ef;} .av.w .av-l{color:#9a6700;}
.av.i{border-color:#8250df;background:#f8f4fe;} .av.i .av-l{color:#8250df;}
.av.c{border-color:#cf222e;background:#fdf3f3;} .av.c .av-l{color:#cf222e;}
.pie{text-align:center;color:var(--gris);font-size:.85rem;padding:0 20px 40px;}
.pie a{color:var(--gris);}
</style>
</head>
<body>
<header class="cab">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</header>
<main class="hoja">
{{ content }}
</main>
<footer class="pie">TDA Lab · Tecnologías Digitales Aplicadas</footer>
<script>
// Pinta las cajas de aviso de GitHub ([!NOTE], [!TIP]...) también aquí.
(function(){
  var T={'NOTE':['n','ⓘ Note'],'TIP':['t','💡 Tip'],'WARNING':['w','⚠ Warning'],
         'IMPORTANT':['i','❕ Important'],'CAUTION':['c','⛔ Caution']};
  document.querySelectorAll('.hoja blockquote').forEach(function(bq){
    var p=bq.querySelector('p'); if(!p) return;
    var m=p.innerHTML.match(/^\s*\[!(NOTE|TIP|WARNING|IMPORTANT|CAUTION)\]\s*(<br\s*\/?>)?/i);
    if(!m) return;
    var k=T[m[1].toUpperCase()];
    p.innerHTML=p.innerHTML.slice(m[0].length);
    var d=document.createElement('div'); d.className='av '+k[0];
    var l=document.createElement('div'); l.className='av-l'; l.textContent=k[1];
    d.appendChild(l); while(bq.firstChild){ d.appendChild(bq.firstChild); }
    bq.parentNode.replaceChild(d,bq);
  });
})();
</script>
</body>
</html>
